[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "colorlog>=6.10.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain-core>=1.4.1",
    "langchain-openai>=1.2.2",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn[standard]>=0.49.0",
    "argon2-cffi>=23.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]


[tool.pytest.ini_options]
# Lives here rather than in pytest.ini: the old pytest.ini held TOML syntax
# under [tool.pytest.ini_options], which pytest.ini does not understand, so the
# whole config — including asyncio_mode — was silently ignored and every async
# test was skipped.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are intentional
"app/routers/*" = ["B008"]  # FastAPI Depends()/Query() in defaults is idiomatic
"app/core/dependencies.py" = ["B008"]
